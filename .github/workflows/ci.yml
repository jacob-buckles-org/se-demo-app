name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Keeps recent runs in the Actions tab and keeps feeding Codesmith
    # history between demos — no new commits, nothing to conflict with
    # the standing migration PR on the unmigrated side.
    - cron: "0 14 * * 1-5"

env:
  # Scales the session-fingerprint verification sweep (SEC-114) and the
  # retention-sweep row counts. Same value as the unmigrated side — the
  # workload is identical; only the runner and caching differ.
  METRICS_WORKLOAD: "200"

jobs:
  frontend-checks:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  backend-build:
    name: Backend build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Verify generated events are current
        run: |
          go run ./tools/genevents
          git diff --exit-code internal/events/

  backend-test:
    name: Backend unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        run: go test -count=1 ./...
