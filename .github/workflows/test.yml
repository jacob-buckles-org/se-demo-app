name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 14 * * 1-5"

env:
  METRICS_WORKLOAD: "200"

jobs:
  backend-integration:
    name: Backend integration (Postgres)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics
          POSTGRES_DB: metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrics"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Integration tests
        env:
          DATABASE_URL: postgres://metrics:metrics@localhost:5432/metrics
        run: go test -count=1 -tags integration ./internal/store/

  # Deliberately undersized: 3 browser projects (chromium/firefox/webkit)
  # run fully in parallel (see frontend/playwright.config.ts) on a runner
  # sized for one. Under memory pressure this intermittently OOM-kills a
  # browser process mid-test rather than failing deterministically — a
  # real resource constraint, not a scripted flake. This is the same job
  # Codesmith has a standing rightsizing recommendation for; see
  # DEMO_RUNBOOK.md for the test-analytics + log-search + utilization +
  # rightsizing arc this feeds.
  e2e:
    name: Dashboard E2E (Playwright)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium firefox webkit
          fi

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
