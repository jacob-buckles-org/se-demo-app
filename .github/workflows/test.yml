name: Integration & E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 14 * * 1-5"

env:
  METRICS_WORKLOAD: "200"

jobs:
  # The Postgres image here is test infrastructure only — a throwaway
  # database for the integration suite to run against. Unrelated to the
  # Docker workflow, which builds this app's own backend/frontend images.
  backend-integration:
    name: Backend integration (Postgres)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics
          POSTGRES_DB: metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrics"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Integration tests
        env:
          DATABASE_URL: postgres://metrics:metrics@localhost:5432/metrics
        run: go test -count=1 -v -tags integration ./internal/store/


  # Runs on main and on the nightly schedule, but not on pull requests: the
  # browser matrix is the slowest thing in CI and it's the wrong signal on a
  # PR, where you want a fast answer about the change itself. Reviewers get
  # the E2E result from the post-merge run.
  e2e:
    name: Dashboard E2E (Playwright)
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium firefox webkit
          fi

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
