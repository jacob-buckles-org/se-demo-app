name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  METRICS_WORKLOAD: "200"

jobs:
  backend-integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics
          POSTGRES_DB: metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrics"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Integration tests
        env:
          DATABASE_URL: postgres://metrics:metrics@localhost:5432/metrics
        run: go test -count=1 -tags integration ./internal/store/

  e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
