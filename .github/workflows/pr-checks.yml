name: PR Checks

# Fast gate for scenario / Codesmith autofix demos. Runs only the frontend
# unit suite at METRICS_WORKLOAD=1 so a planted aggregate regression goes
# red in well under a minute — safe to open live on a call.
#
# Deliberately separate from Observability (flaky E2E) and Full CI (slow
# feature tour). Autofix should chase the real regression, not a flake.

on:
  pull_request:
  workflow_dispatch:

env:
  METRICS_WORKLOAD: "1"

jobs:
  unit:
    name: Unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit
