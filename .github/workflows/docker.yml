name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * 1-5"

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build backend image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: backend/
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/metrics-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/metrics-backend:latest

  # Paired "cold" job: same context, same runner class, GitHub's own
  # type=gha cache backend instead of Blacksmith's sticky-disk-backed
  # build-push-action. One workflow run shows both timings side by side,
  # isolating the cache-backend delta from the hardware delta already
  # shown by comparing this repo to se-demo-app-unmigrated.
  build-backend-gha-cache:
    name: Build backend image (GHA cache, for comparison)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/metrics-backend-gha-cache:${{ github.sha }}
          cache-from: type=gha,scope=backend-comparison
          cache-to: type=gha,mode=max,scope=backend-comparison

  build-frontend:
    name: Build frontend image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontend/
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/metrics-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository }}/metrics-dashboard:latest

  # Paired "cold" job — see build-backend-gha-cache above.
  build-frontend-gha-cache:
    name: Build frontend image (GHA cache, for comparison)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/metrics-dashboard-gha-cache:${{ github.sha }}
          cache-from: type=gha,scope=frontend-comparison
          cache-to: type=gha,mode=max,scope=frontend-comparison
