name: "Docker: Images & Stack Smoke"

# Builds are never pushed anywhere — this workflow exists to demonstrate
# build/cache timing, not to publish a deployable image, so there's no
# registry login and no push step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * 1-5"

permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/setup-docker-builder@v1

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          context: backend/
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/metrics-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/metrics-backend:latest

  build-frontend:
    name: Build frontend image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/setup-docker-builder@v1

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontend/
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/metrics-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository }}/metrics-dashboard:latest

  # Brings the whole stack up the same way a developer does locally, to catch
  # wiring regressions the per-service builds can't (bad DATABASE_URL, a
  # service that builds but won't boot, a broken healthcheck).
  #
  # Deliberately plain `docker compose` — no Blacksmith builder here. The
  # per-service jobs above cover build-layer caching; this job's cost is
  # dominated by *pulling* images (postgres, plus the golang/node build bases),
  # which is what container caching addresses.
  stack-smoke:
    name: Full-stack smoke (docker compose)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stack
        run: docker compose up -d --build

      - name: Smoke-test the API
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/metrics | head -c 200
          echo

      - name: Smoke-test the dashboard
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:4173/ -o /dev/null

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
